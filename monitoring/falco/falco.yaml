json_output: true
json_include_output_property: true
json_include_tags_property: true
priority: debug
buffered_outputs: false
syslog_output:
  enabled: false
stdout_output:
  enabled: true
file_output:
  enabled: false

http_output:
  enabled: false

program_output:
  enabled: false

rules_file:
  - /etc/falco/falco_rules.yaml
  - /etc/falco/falco_rules.local.yaml
  - /etc/falco/k8s_audit_rules.yaml
  - /etc/falco/rules.d

load_plugins: []
