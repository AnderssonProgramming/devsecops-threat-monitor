services:
  falco:
    image: falcosecurity/falco-no-driver:latest
    container_name: logiflow-falco
    privileged: true
    restart: unless-stopped
    command:
      - /usr/bin/falco
      - -c
      - /etc/falco/falco.yaml
      - -r
      - /etc/falco/rules.d/logiflow-rules.yaml
      - -r
      - /etc/falco/rules.d/owasp-top10-rules.yaml
    volumes:
      - ./falco/falco.yaml:/etc/falco/falco.yaml:ro
      - ./falco/rules:/etc/falco/rules.d:ro
      - /var/run/docker.sock:/host/var/run/docker.sock
      - /proc:/host/proc:ro
      - /boot:/host/boot:ro
      - /lib/modules:/host/lib/modules:ro
      - /usr:/host/usr:ro
    networks:
      - logiflow-security-net

  prometheus:
    image: prom/prometheus:latest
    container_name: logiflow-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    networks:
      - logiflow-security-net

  grafana:
    image: grafana/grafana:latest
    container_name: logiflow-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3030:3000"
    networks:
      - logiflow-security-net

  loki:
    image: grafana/loki:latest
    container_name: logiflow-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks:
      - logiflow-security-net

  tempo:
    image: grafana/tempo:2.6.1
    container_name: logiflow-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4317:4317"
    networks:
      - logiflow-security-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: logiflow-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otel-collector-config.yml"]
    volumes:
      - ./otel-collector/otel-collector-config.yml:/etc/otelcol/otel-collector-config.yml:ro
    ports:
      - "4318:4318"
    depends_on:
      - tempo
    networks:
      - logiflow-security-net

  promtail:
    image: grafana/promtail:latest
    container_name: logiflow-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./loki/promtail-config.yml:/etc/promtail/config.yml:ro
    networks:
      - logiflow-security-net

networks:
  logiflow-security-net:
    external: true

volumes:
  grafana_data:
