name: DAST Scan - OWASP ZAP On Demand

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Target LogiFlow gateway URL
        required: true
        default: http://localhost:3000

permissions:
  contents: read

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ZAP baseline scan
        env:
          LOGIFLOW_GATEWAY_URL: ${{ github.event.inputs.target_url }}
        run: bash dast/scripts/run-dast.sh

      - name: Parse report
        run: |
          REPORT_FILE=$(ls -1t dast/reports/zap-report-*.json | head -n 1)
          node dast/scripts/parse-zap-report.js "$REPORT_FILE"

      - name: Upload DAST artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dast-report
          path: dast/reports/
